<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ROVE — Bike Rental Platform Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12141C;
  --ink-soft:#2A2E3C;
  --paper:#F1F2ED;
  --paper-alt:#E7E9E1;
  --paper-card:#FFFFFF;
  --route-blue:#3B4CE0;
  --route-blue-dark:#2733A6;
  --route-blue-tint:#E9EAFB;
  --lime:#C4F53C;
  --lime-ink:#26330A;
  --slate:#6B7280;
  --slate-light:#9CA0AE;
  --line:#DEE0D8;
  --amber:#F5A623;
  --coral:#E5484D;
  --radius:14px;
  --radius-lg:22px;
  --shadow:0 1px 2px rgba(18,20,28,.04), 0 8px 24px -8px rgba(18,20,28,.10);
  --shadow-lg:0 4px 10px rgba(18,20,28,.06), 0 24px 48px -16px rgba(18,20,28,.20);
  --ff-display:'Space Grotesk',sans-serif;
  --ff-body:'Inter',sans-serif;
  --ff-mono:'JetBrains Mono',monospace;
  --gutter:48px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;}
body{font-family:var(--ff-body);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
a{color:inherit;text-decoration:none;}
::selection{background:var(--lime);color:var(--lime-ink);}

h1,h2,h3,h4{font-family:var(--ff-display);letter-spacing:-0.02em;line-height:1.05;}
.mono{font-family:var(--ff-mono);letter-spacing:-0.01em;}
.eyebrow{font-family:var(--ff-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);}

/* ---------- layout shell ---------- */
.proto-badge{position:fixed;top:14px;right:14px;z-index:999;display:flex;align-items:center;gap:8px;background:var(--ink);padding:6px;border-radius:999px;box-shadow:var(--shadow-lg);max-width:calc(100vw - 20px);}
.proto-badge span{font-family:var(--ff-mono);font-size:10px;color:var(--slate-light);padding:0 8px;letter-spacing:.06em;}
.proto-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;}
.proto-toggle button{border:none;background:transparent;color:#B8BCCB;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;transition:all .25s ease;white-space:nowrap;}
.proto-toggle button.active{background:var(--lime);color:var(--lime-ink);}

#app{min-height:100vh;}
.view{animation:viewIn .5s cubic-bezier(.16,1,.3,1) both;}
@keyframes viewIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important;}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;font-weight:600;font-size:14px;padding:13px 24px;border:1px solid transparent;transition:transform .18s ease, box-shadow .18s ease, background .18s ease;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--lime);color:var(--lime-ink);}
.btn-primary:hover{box-shadow:0 8px 20px -6px rgba(196,245,60,.55);transform:translateY(-1px);}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:var(--ink-soft);transform:translateY(-1px);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-ghost{background:transparent;color:var(--slate);font-weight:500;}
.btn-ghost:hover{color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:9px 16px;font-size:13px;}

/* ---------- splash / animated logo intro ---------- */
#splash{position:fixed;inset:0;z-index:2000;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .7s cubic-bezier(.4,0,.2,1);}
#splash::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(196,245,60,.035) 0 3px,transparent 3px 26px);pointer-events:none;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-road{width:min(560px,82vw);position:relative;z-index:2;}
.splash-word{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:opacity .55s ease, transform .55s ease;position:relative;z-index:2;}
.splash-word.show{opacity:1;transform:translateY(0);}
.splash-word .mark{display:flex;align-items:center;gap:10px;}
.splash-word .mark .lm{width:34px;height:34px;border-radius:10px;background:var(--lime);position:relative;overflow:hidden;flex-shrink:0;}
.splash-word .mark .lm::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,var(--ink) 0 3px,transparent 3px 7px);opacity:.85;}
.splash-word h2{font-family:var(--ff-display);font-size:26px;color:#fff;font-weight:700;letter-spacing:-0.01em;}
.splash-word .tag{font-family:var(--ff-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8B90A6;}
.splash-pct{position:absolute;bottom:28px;left:0;right:0;text-align:center;font-family:var(--ff-mono);font-size:10.5px;color:#5C6070;letter-spacing:.1em;z-index:2;padding:0 16px;}
.splash-skip{position:absolute;bottom:28px;right:20px;font-family:var(--ff-mono);font-size:10.5px;color:#5C6070;letter-spacing:.06em;z-index:2;cursor:pointer;transition:color .2s;padding:6px;}
.splash-skip:hover{color:#B8BCCB;}
@media (prefers-reduced-motion: reduce){#splash{display:none !important;}}

/* ---------- route line signature ---------- */
.route-divider{position:relative;height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 10px,transparent 10px 18px);margin:0;}
.route-dot{width:9px;height:9px;border-radius:50%;background:var(--route-blue);flex-shrink:0;box-shadow:0 0 0 4px var(--route-blue-tint);}
.route-dot.lime{background:var(--lime);box-shadow:0 0 0 4px rgba(196,245,60,.28);}

/* ---------- badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;font-family:var(--ff-mono);letter-spacing:.02em;text-transform:uppercase;}
.badge-blue{background:var(--route-blue-tint);color:var(--route-blue-dark);}
.badge-lime{background:#F2FCD9;color:#4B6B0C;}
.badge-amber{background:#FEF3E0;color:#8A5A0A;}
.badge-coral{background:#FCE9E9;color:#A5262B;}
.badge-slate{background:#EEEFEA;color:var(--slate);}

/* ---------- cards ---------- */
.card{background:var(--paper-card);border-radius:var(--radius-lg);border:1px solid var(--line);box-shadow:var(--shadow);}

/* ==================================================================
   CUSTOMER SITE
   ================================================================== */
.c-nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px var(--gutter);background:rgba(241,242,237,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);gap:12px;}
.c-logo{display:flex;align-items:center;gap:9px;font-family:var(--ff-display);font-weight:700;font-size:20px;flex-shrink:0;}
.c-logo-mark{width:30px;height:30px;border-radius:9px;background:var(--ink);position:relative;overflow:hidden;flex-shrink:0;}
.c-logo-mark::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,var(--lime) 0 3px,transparent 3px 7px);opacity:.9;}
.c-navlinks{display:flex;gap:32px;align-items:center;overflow-x:auto;scrollbar-width:none;}
.c-navlinks::-webkit-scrollbar{display:none;}
.c-navlinks a{font-size:14px;font-weight:500;color:var(--slate);transition:color .2s;cursor:pointer;white-space:nowrap;}
.c-navlinks a:hover,.c-navlinks a.active{color:var(--ink);}
.c-navright{display:flex;gap:12px;align-items:center;flex-shrink:0;}

.hero{padding:76px var(--gutter) 0;max-width:1360px;margin:0 auto;text-align:center;position:relative;}
.hero h1{font-size:clamp(32px,5.4vw,68px);font-weight:600;max-width:900px;margin:22px auto 18px;}
.hero p{max-width:560px;margin:0 auto;color:var(--slate);font-size:17px;line-height:1.6;}
.hero-route{margin:48px auto 0;max-width:640px;height:60px;position:relative;}
.hero-route svg{width:100%;height:100%;}
.hero-route path{stroke-dasharray:6 8;stroke-dashoffset:400;animation:draw 1.6s ease forwards .3s;}
@keyframes draw{to{stroke-dashoffset:0;}}

.search-ticket{max-width:1040px;margin:-30px auto 0;background:var(--ink);border-radius:20px;padding:22px;display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:14px;align-items:end;box-shadow:var(--shadow-lg);position:relative;z-index:5;}
.search-field label{display:block;font-family:var(--ff-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8B90A6;margin-bottom:8px;}
.search-field select,.search-field input{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;padding:11px 12px;border-radius:10px;font-size:14px;}
.search-field select option{color:#111;}
.search-ticket .btn{height:44px;white-space:nowrap;}

.section{padding:96px var(--gutter);max-width:1360px;margin:0 auto;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:42px;gap:24px;flex-wrap:wrap;}
.section-head h2{font-size:clamp(24px,3vw,38px);font-weight:600;}

.route-steps{display:flex;align-items:flex-start;gap:0;margin-top:20px;}
.route-step{flex:1;position:relative;padding-top:26px;}
.route-step:not(:last-child)::after{content:"";position:absolute;top:9px;left:calc(50% + 26px);right:calc(-50% + 26px);height:2px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 14px);}
.route-step .num{width:20px;height:20px;border-radius:50%;background:var(--route-blue);position:absolute;top:0;left:calc(50% - 10px);box-shadow:0 0 0 5px var(--paper);}
.route-step h4{text-align:center;font-size:17px;margin:14px 0 8px;}
.route-step p{text-align:center;font-size:14px;color:var(--slate);max-width:220px;margin:0 auto;line-height:1.55;}

.veh-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:22px;}
.veh-card{overflow:hidden;transition:transform .28s ease, box-shadow .28s ease;cursor:pointer;}
.veh-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg);}
.veh-card .img-wrap{position:relative;height:180px;overflow:hidden;}
.veh-card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease;}
.veh-card:hover .img-wrap img{transform:scale(1.08);}
.veh-card .img-wrap .tag{position:absolute;top:12px;left:12px;}
.veh-body{padding:18px;}
.veh-body .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px;}
.veh-body h3{font-size:17px;font-weight:600;}
.veh-body .city{font-size:12.5px;color:var(--slate);margin-bottom:14px;}
.veh-price{display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px dashed var(--line);gap:10px;}
.veh-price .amt{font-family:var(--ff-mono);font-size:19px;font-weight:600;}
.veh-price .unit{font-size:11px;color:var(--slate);}
.rating{font-family:var(--ff-mono);font-size:12.5px;display:flex;align-items:center;gap:4px;color:var(--ink-soft);flex-shrink:0;}

.strip{display:flex;gap:0;overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:20px 0;}
.strip-track{display:flex;gap:48px;animation:scroll 22s linear infinite;white-space:nowrap;}
@keyframes scroll{from{transform:translateX(0);}to{transform:translateX(-50%);}}
.strip-track span{font-family:var(--ff-mono);font-size:13px;color:var(--slate);letter-spacing:.04em;}

.footer{padding:56px var(--gutter) 40px;border-top:1px solid var(--line);}
.footer-grid{max-width:1360px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:24px;}
.footer p{color:var(--slate);font-size:13px;}

/* ---- browse ---- */
.browse-wrap{max-width:1360px;margin:0 auto;padding:32px var(--gutter) 96px;display:grid;grid-template-columns:240px 1fr;gap:36px;}
.filters h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-family:var(--ff-mono);color:var(--slate);margin:22px 0 12px;}
.filters h4:first-child{margin-top:0;}
.chk{display:flex;align-items:center;gap:9px;font-size:14px;padding:6px 0;color:var(--ink-soft);cursor:pointer;}
.chk input{accent-color:var(--route-blue);width:16px;height:16px;}
.browse-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px;flex-wrap:wrap;}
.browse-top .count{font-family:var(--ff-mono);font-size:13px;color:var(--slate);}

/* ---- detail ---- */
.detail-wrap{max-width:1180px;margin:0 auto;padding:36px var(--gutter) 100px;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--slate);margin-bottom:26px;font-weight:500;}
.back-link:hover{color:var(--ink);}
.detail-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;}
.detail-gallery .main{border-radius:var(--radius-lg);overflow:hidden;height:360px;margin-bottom:12px;}
.detail-gallery .main img{width:100%;height:100%;object-fit:cover;}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.thumbs div{height:70px;border-radius:10px;overflow:hidden;opacity:.55;cursor:pointer;transition:opacity .2s;}
.thumbs div:first-child{opacity:1;}
.thumbs img{width:100%;height:100%;object-fit:cover;}
.detail-side h1{font-size:30px;margin:8px 0 6px;}
.spec-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0;}
.spec-item{background:var(--paper-alt);border-radius:12px;padding:12px 14px;}
.spec-item .l{font-size:11px;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;font-family:var(--ff-mono);}
.spec-item .v{font-size:14.5px;font-weight:600;margin-top:3px;}
.addon-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);gap:10px;}
.addon-row:last-child{border-bottom:none;}
.addon-row label{display:flex;gap:10px;align-items:center;font-size:14.5px;}
.addon-row .price{font-family:var(--ff-mono);font-size:13.5px;color:var(--slate);flex-shrink:0;}
.fare-box{background:var(--ink);color:#fff;border-radius:var(--radius-lg);padding:22px;margin-top:22px;}
.fare-row{display:flex;justify-content:space-between;font-size:13.5px;padding:7px 0;color:#B8BCCB;gap:10px;}
.fare-row.total{border-top:1px dashed rgba(255,255,255,.2);margin-top:8px;padding-top:14px;font-size:17px;color:#fff;font-weight:600;font-family:var(--ff-mono);}
.fare-row span:last-child{font-family:var(--ff-mono);color:#fff;}
.fare-row.total span:last-child{color:var(--lime);}

/* ---- booking flow ---- */
.flow-wrap{max-width:820px;margin:0 auto;padding:36px var(--gutter) 110px;}
.stepper{display:flex;margin-bottom:48px;}
.step{flex:1;text-align:center;position:relative;min-width:0;}
.step:not(:last-child)::after{content:"";position:absolute;top:13px;left:calc(50% + 24px);right:calc(-50% + 24px);height:2px;background:var(--line);}
.step.done:not(:last-child)::after{background:var(--route-blue);}
.step .circ{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--paper-card);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-family:var(--ff-mono);font-size:12px;font-weight:600;color:var(--slate);position:relative;z-index:2;transition:all .3s;}
.step.active .circ{border-color:var(--lime);background:var(--lime);color:var(--lime-ink);transform:scale(1.1);}
.step.done .circ{border-color:var(--route-blue);background:var(--route-blue);color:#fff;}
.step .lbl{font-size:12px;color:var(--slate);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px;}
.step.active .lbl{color:var(--ink);font-weight:600;}
.flow-card{padding:32px;}
.flow-card h2{font-size:24px;margin-bottom:6px;}
.flow-card>p.sub{color:var(--slate);font-size:14px;margin-bottom:28px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.form-field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;}
.form-field input,.form-field select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 13px;font-size:14px;background:var(--paper-card);transition:border-color .2s;}
.form-field input:focus,.form-field select:focus{outline:none;border-color:var(--route-blue);}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--slate);font-size:13.5px;margin-top:6px;transition:border-color .2s;}
.dropzone:hover{border-color:var(--route-blue);}
.pay-methods{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
.pay-method{border:1.5px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:all .2s;font-size:14px;font-weight:600;display:flex;align-items:center;gap:10px;}
.pay-method:hover{border-color:var(--route-blue);}
.pay-method.sel{border-color:var(--lime);background:#F9FDEE;box-shadow:0 0 0 3px rgba(196,245,60,.25);}
.flow-actions{display:flex;justify-content:space-between;margin-top:30px;gap:12px;flex-wrap:wrap;}

.confirm-ticket{position:relative;background:var(--ink);color:#fff;border-radius:24px;padding:40px;text-align:center;overflow:hidden;}
.confirm-ticket::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(196,245,60,.04) 0 3px,transparent 3px 22px);}
.confirm-badge{width:64px;height:64px;border-radius:50%;background:var(--lime);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;position:relative;z-index:2;}
.confirm-ticket h2{position:relative;z-index:2;font-size:26px;margin-bottom:8px;}
.confirm-ticket .bid{position:relative;z-index:2;font-family:var(--ff-mono);color:var(--lime);font-size:14px;margin-bottom:26px;}
.confirm-grid{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:16px;text-align:left;background:rgba(255,255,255,.05);border-radius:16px;padding:20px;margin-bottom:24px;border:1px dashed rgba(255,255,255,.2);}
.confirm-grid .l{font-family:var(--ff-mono);font-size:10px;color:#8B90A6;text-transform:uppercase;letter-spacing:.08em;}
.confirm-grid .v{font-size:14px;font-weight:600;margin-top:3px;}
.qr-mock{width:110px;height:110px;background:repeating-conic-gradient(#fff 0% 25%, transparent 0% 50%) 0 0/16px 16px, #fff;border-radius:12px;margin:0 auto 24px;position:relative;z-index:2;}

/* ==================================================================
   ADMIN PANEL
   ================================================================== */
.admin-shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.a-sidebar{background:var(--ink);color:#fff;padding:24px 16px;display:flex;flex-direction:column;}
.a-logo{display:flex;align-items:center;gap:9px;font-family:var(--ff-display);font-weight:700;font-size:18px;padding:6px 10px 30px;}
.a-nav{display:flex;flex-direction:column;gap:3px;}
.a-nav a{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:#9DA1B5;transition:all .2s;cursor:pointer;}
.a-nav a svg{opacity:.8;flex-shrink:0;}
.a-nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.a-nav a.active{background:var(--lime);color:var(--lime-ink);}
.a-nav a.active svg{opacity:1;}
.a-nav-label{font-family:var(--ff-mono);font-size:10px;letter-spacing:.1em;color:#5C6070;text-transform:uppercase;margin:22px 12px 8px;}
.a-side-foot{margin-top:auto;padding:14px 12px;background:rgba(255,255,255,.05);border-radius:12px;font-size:12px;color:#9DA1B5;}
.a-side-foot b{color:#fff;display:block;font-size:13px;margin-bottom:2px;}

.a-main{padding:0;min-width:0;}
.a-topbar{display:flex;justify-content:space-between;align-items:center;padding:20px 36px;border-bottom:1px solid var(--line);background:var(--paper-card);position:sticky;top:0;z-index:10;gap:12px;}
.a-topbar h1{font-size:20px;}
.branch-pill{display:flex;align-items:center;gap:8px;background:var(--paper-alt);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;white-space:nowrap;}
.a-topright{display:flex;gap:14px;align-items:center;flex-shrink:0;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--route-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;font-family:var(--ff-mono);flex-shrink:0;}

.a-content{padding:32px 36px 60px;}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px;}
.kpi-card{padding:20px;}
.kpi-card .l{font-size:12.5px;color:var(--slate);font-weight:500;margin-bottom:10px;}
.kpi-card .v{font-family:var(--ff-mono);font-size:28px;font-weight:600;}
.kpi-card .d{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;margin-top:8px;}
.d.up{color:#3D8A3D;}
.d.down{color:var(--coral);}

.a-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px;}
.panel{padding:22px;}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap;}
.panel-head h3{font-size:15.5px;}
.pickup-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--paper-alt);}
.pickup-row:last-child{border-bottom:none;}
.pickup-row .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.pickup-row .meta{flex:1;min-width:0;}
.pickup-row .name{font-size:13.5px;font-weight:600;}
.pickup-row .sub{font-size:11.5px;color:var(--slate);}
.pickup-row .time{font-family:var(--ff-mono);font-size:12px;color:var(--slate);flex-shrink:0;}

.bar-chart{display:flex;align-items:flex-end;gap:14px;height:120px;margin-top:6px;}
.bar-chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;}
.bar-chart .bar{width:100%;background:var(--route-blue);border-radius:6px 6px 3px 3px;transition:height .6s ease;}
.bar-chart .bar.lime{background:var(--lime);}
.bar-chart .lbl{font-size:10.5px;color:var(--slate);font-family:var(--ff-mono);}

.spark{width:100%;height:70px;}

.table-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:16px;flex-wrap:wrap;}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
.chips::-webkit-scrollbar{display:none;}
.chip{padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--paper-alt);color:var(--slate);cursor:pointer;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.chip.active{background:var(--ink);color:#fff;}
.search-input{border:1.5px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13.5px;min-width:220px;}
.search-input:focus{outline:none;border-color:var(--route-blue);}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px;}
table{width:100%;border-collapse:collapse;}
.data-table{min-width:640px;}
.data-table thead th{text-align:left;font-family:var(--ff-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);padding:0 16px 12px;font-weight:500;}
.data-table tbody tr{background:var(--paper-card);transition:background .15s;}
.data-table tbody tr:hover{background:var(--paper-alt);}
.data-table td{padding:14px 16px;font-size:13.5px;border-top:1px solid var(--paper-alt);white-space:nowrap;}
.data-table tbody tr td:first-child{border-radius:12px 0 0 12px;}
.data-table tbody tr td:last-child{border-radius:0 12px 12px 0;}
.veh-cell{display:flex;align-items:center;gap:10px;}
.veh-cell img{width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;}
.veh-cell .n{font-weight:600;}
.veh-cell .s{font-size:11.5px;color:var(--slate);}

.status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:6px;}

/* ==================================================================
   RESPONSIVE — TABLET
   ================================================================== */
@media(max-width:1000px){
  :root{--gutter:28px;}
  .search-ticket{grid-template-columns:1fr 1fr;}
  .detail-grid{grid-template-columns:1fr;}
  .browse-wrap{grid-template-columns:1fr;}
  .kpi-grid{grid-template-columns:1fr 1fr;}
  .a-cols{grid-template-columns:1fr;}

  .admin-shell{grid-template-columns:1fr;grid-template-rows:auto 1fr;}
  .a-sidebar{
    flex-direction:row;align-items:center;padding:12px 14px;
    gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    position:sticky;top:0;z-index:20;
  }
  .a-sidebar::-webkit-scrollbar{display:none;}
  .a-logo{padding:6px 12px 6px 4px;flex-shrink:0;}
  .a-nav{flex-direction:row;gap:4px;flex-shrink:0;}
  .a-nav a{padding:9px 12px;white-space:nowrap;}
  .a-nav-label{display:none;}
  .a-side-foot{display:none;}
}

/* ==================================================================
   RESPONSIVE — MOBILE
   ================================================================== */
@media(max-width:640px){
  :root{--gutter:18px;}

  /* customer nav */
  .c-nav{padding:14px var(--gutter);}
  .c-logo{font-size:17px;}
  .c-logo-mark{width:26px;height:26px;}
  .c-navlinks{gap:18px;}
  .c-navlinks a:nth-child(3),.c-navlinks a:nth-child(4){display:none;}
  .c-navright .btn-ghost{display:none;}
  .c-navright .btn{padding:9px 14px;font-size:12.5px;}

  /* hero */
  .hero{padding:44px var(--gutter) 0;}
  .hero h1{margin:16px auto 12px;}
  .hero p{font-size:15px;}
  .hero-route{margin:30px auto 0;height:44px;max-width:100%;}

  /* search ticket */
  .search-ticket{grid-template-columns:1fr;margin:20px var(--gutter) 0;padding:16px;gap:12px;max-width:none;}
  .search-ticket .btn{width:100%;margin-top:2px;}

  .section{padding:56px var(--gutter);}
  .section-head{margin-bottom:26px;}
  .section-head .btn{width:100%;}

  .route-steps{flex-direction:column;gap:28px;}
  .route-step:not(:last-child)::after{display:none;}
  .route-step p{max-width:none;}

  .veh-grid{grid-template-columns:1fr;gap:16px;}
  .veh-card .img-wrap{height:170px;}

  .footer{padding:36px var(--gutter) 28px;}
  .footer-grid{flex-direction:column;align-items:flex-start;gap:14px;}

  /* browse */
  .browse-wrap{padding:24px var(--gutter) 64px;gap:24px;}
  .filters{display:flex;flex-wrap:wrap;column-gap:28px;}
  .filters h4{width:100%;margin:14px 0 8px;}
  .filters h4:first-child{margin-top:0;}
  .browse-top .count{order:2;}
  .browse-top select{flex:1;min-width:0;}

  /* detail */
  .detail-wrap{padding:22px var(--gutter) 64px;}
  .detail-gallery .main{height:220px;}
  .thumbs{grid-template-columns:repeat(4,1fr);gap:6px;}
  .thumbs div{height:52px;}
  .detail-side h1{font-size:24px;}
  .spec-grid{gap:10px;margin:18px 0;}

  /* booking flow */
  .flow-wrap{padding:22px var(--gutter) 80px;}
  .stepper{margin-bottom:30px;}
  .step .lbl{font-size:10px;}
  .flow-card{padding:20px;}
  .flow-card h2{font-size:20px;}
  .form-row{grid-template-columns:1fr;gap:12px;}
  .pay-methods{grid-template-columns:1fr;}
  .flow-actions{flex-direction:column-reverse;}
  .flow-actions .btn{width:100%;}
  .confirm-ticket{padding:26px 18px;}
  .confirm-grid{grid-template-columns:1fr;}

  /* admin */
  .a-topbar{padding:14px var(--gutter);}
  .a-topbar h1{font-size:17px;}
  .branch-pill span,.branch-pill{font-size:12px;padding:7px 11px;}
  .a-content{padding:20px var(--gutter) 48px;}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .kpi-card{padding:15px;}
  .kpi-card .v{font-size:22px;}
  .panel{padding:16px;}
  .a-cols{gap:14px;margin-bottom:14px;}

  .table-toolbar{align-items:stretch;}
  .search-input{min-width:0;width:100%;}
}

@media(max-width:420px){
  .proto-badge{top:8px;right:8px;padding:4px;}
  .proto-toggle button{padding:6px 10px;font-size:11px;}
  .proto-badge span{display:none;}

  .hero h1{font-size:28px;}
  .kpi-grid{grid-template-columns:1fr;}
  .thumbs{grid-template-columns:repeat(4,1fr);}
  .spec-grid{grid-template-columns:1fr 1fr;}
  .bar-chart{gap:8px;}
}
</style>

<body>

<script>
/* ============================== DATA ============================== */

  check: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#26330A" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>`,
};

const VEHICLES = [
  {id:1, name:"Honda Activa 6G", cat:"Scooter", fuel:"Petrol", city:"Jaipur, India", country:"IN", price:350, currency:"₹", rating:4.8, cc:"110cc", range:"60 km/l", seed:"activa1"},

  {id:10, name:"Hero Electric Optima", cat:"E-Bike", fuel:"Electric", city:"Jaipur, India", country:"IN", price:280, currency:"₹", rating:4.3, cc:"—", range:"82 km/charge", seed:"hero10"},

const FLEET_STATUS = [

  {status:"Maintenance", color:"#F5A623"}, {status:"Out of Service", color:"#E5484D"},

const FLEET = VEHICLES.map((v,i)=>({...v, reg:"RJ14-"+(2200+i)+"-"+String.fromCharCode(65+i), st:FLEET_STATUS[i%4], odo:(4200+i*870)}));

const BOOKINGS = [

function img(seed,w=600,h=400){
  // Real vehicle photos from LoremFlickr (keyword-based, not placeholder images).
  const photoTerms = {
    activa1: "honda,scooter",
    jupiter2: "scooter,moped",
    re3: "royal,enfield,motorcycle",
    ather4: "electric,scooter",
    nmax5: "scooter,motorbike",
    pcx6: "scooter,motorbike",
    ktm7: "ktm,motorcycle",
    ola8: "electric,scooter",
    vespa9: "vespa,scooter",
    hero10: "electric,bicycle"
  };
  const terms = photoTerms[seed] || "motorcycle,scooter";
  const lock = Math.abs([...seed].reduce((n,c) => n + c.charCodeAt(0), 0)) + 1;
  return `https://loremflickr.com/${w}/${h}/${terms}?lock=${lock}`;
}
function fmt(n){ return n.toLocaleString(); }

/* ============================== STATE ============================== */
let state = { site:"customer", view:"home", vehicleId:1, step:1, addons:{helmet:true,driver:false,insurance:true}, pay:"upi" };

function setSite(s){ state.site=s; state.view = s==="customer"?"home":"dashboard";
  document.querySelectorAll('.proto-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.site===s));
  render(); window.scrollTo(0,0);
}
function nav(view, params={}){ state = {...state, view, ...params}; render(); window.scrollTo(0,0); }

document.getElementById('siteToggle').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return; setSite(btn.dataset.site);
});

  return `<svg viewBox="0 0 640 60" fill="none" preserveAspectRatio="xMidYMid meet">

}

/* ============================== VEHICLE CARD ============================== */
function vehCard(v){
  return `<div class="card veh-card" onclick="nav('detail',{vehicleId:${v.id}})">

}

/* ============================== HOME ============================== */
function viewHome(){
  const featured = VEHICLES.slice(0,6).map(vehCard).join('');
  return `<div class="view">
  ${customerNav('home')}
  <div class="hero">

    <div class="search-field"><label>Vehicle type</label>
      <select><option>Any type</option><option>Scooter</option><option>Motorcycle</option><option>E-Bike</option></select>

    <button class="btn btn-primary" onclick="nav('browse')">Search rides</button>

  <div class="section" style="padding-top:130px;">

/* ============================== DETAIL ============================== */
function viewDetail(){
  const v = VEHICLES.find(x=>x.id===state.vehicleId) || VEHICLES[0];
  const addons = state.addons;
  const addonPrice = (addons.helmet?0:0) + (addons.driver?150:0) + (addons.insurance?60:0);
  const base = v.price*2;
  const subtotal = base+addonPrice;
  const tax = Math.round(subtotal*0.05);
  const deposit = v.cat==="Motorcycle"?1500:800;
  const total = subtotal+tax;
  return `<div class="view">
  ${customerNav('detail')}
  <div class="detail-wrap">
    <a class="back-link" onclick="nav('browse')">${ICONS.back} Back to results</a>
    <div class="detail-grid">
      <div class="detail-gallery">
        <div class="main"><img src="${img(v.seed,900,600)}" alt="${v.name}"></div>
        <div class="thumbs">
          <div><img src="${img(v.seed+'a',200,150)}"></div>
          <div><img src="${img(v.seed+'b',200,150)}"></div>
          <div><img src="${img(v.seed+'c',200,150)}"></div>
          <div><img src="${img(v.seed+'d',200,150)}"></div>
        </div>
      </div>
      <div class="detail-side">
        <span class="badge badge-blue">${v.cat}</span>
        <h1>${v.name}</h1>
        <div class="rating">${ICONS.star} ${v.rating} rating · ${v.city}</div>
        <div class="spec-grid">
          <div class="spec-item"><div class="l">Engine / Range</div><div class="v">${v.cc}</div></div>
          <div class="spec-item"><div class="l">Efficiency</div><div class="v">${v.range}</div></div>
          <div class="spec-item"><div class="l">Fuel type</div><div class="v">${v.fuel}</div></div>
          <div class="spec-item"><div class="l">Included</div><div class="v">80 km/day free</div></div>
        </div>
        <h4 style="margin-bottom:6px;font-size:14.5px;">Add-ons</h4>
        <div class="addon-row"><label><input type="checkbox" ${addons.helmet?'checked':''} onchange="toggleAddon('helmet')">Extra helmet</label><span class="price mono">Free</span></div>
        <div class="addon-row"><label><input type="checkbox" ${addons.driver?'checked':''} onchange="toggleAddon('driver')">Additional driver</label><span class="price mono">+${v.currency}150</span></div>
        <div class="addon-row"><label><input type="checkbox" ${addons.insurance?'checked':''} onchange="toggleAddon('insurance')">Damage waiver</label><span class="price mono">+${v.currency}60</span></div>

        <div class="fare-box">
          <div class="fare-row"><span>Base fare (2 days)</span><span>${v.currency}${fmt(base)}</span></div>
          <div class="fare-row"><span>Add-ons</span><span>${v.currency}${addonPrice}</span></div>
          <div class="fare-row"><span>Tax (5%)</span><span>${v.currency}${tax}</span></div>
          <div class="fare-row"><span>Refundable deposit</span><span>${v.currency}${fmt(deposit)}</span></div>
          <div class="fare-row total"><span>Total due now</span><span>${v.currency}${fmt(total)}</span></div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:16px;" onclick="nav('booking',{step:1})">Continue to book →</button>
      </div>
    </div>
  </div>
  ${footer()}
  </div>`;
}
function toggleAddon(k){ state.addons[k]=!state.addons[k]; render(); }

/* ============================== BOOKING FLOW ============================== */
const STEP_LABELS = ["Dates & Add-ons","Your details","Payment","Confirmed"];
function stepper(){
  return `<div class="stepper">${STEP_LABELS.map((l,i)=>{
    const n=i+1; const cls = n<state.step?'done':n===state.step?'active':'';
    return `<div class="step ${cls}"><div class="circ">${n<state.step?'✓':n}</div><div class="lbl">${l}</div></div>`;
  }).join('')}</div>`;
}
function viewBooking(){
  const v = VEHICLES.find(x=>x.id===state.vehicleId) || VEHICLES[0];
  let body='';
  if(state.step===1){
    body = `<div class="flow-card card">
      <h2>Dates &amp; add-ons</h2><p class="sub">Confirm your rental window for the ${v.name}.</p>
      <div class="form-row">
        <div class="form-field"><label>Pickup date &amp; time</label><input type="datetime-local" value="2026-08-20T10:00"></div>
        <div class="form-field"><label>Return date &amp; time</label><input type="datetime-local" value="2026-08-22T10:00"></div>
      </div>
      <div class="form-row">
        <div class="form-field"><label>Pickup branch</label><select><option>${v.city} — Main Branch</option></select></div>
        <div class="form-field"><label>Rate type</label><select><option>Daily</option><option>Weekly</option><option>Hourly</option></select></div>
      </div>
      <div class="flow-actions"><span></span><button class="btn btn-primary" onclick="nav('booking',{step:2})">Continue →</button></div>
    </div>`;
  } else if(state.step===2){
    body = `<div class="flow-card card">
      <h2>Your details</h2><p class="sub">This unlocks booking confirmation once verified — usually within minutes.</p>
      <div class="form-row">
        <div class="form-field"><label>Full name</label><input placeholder="Aarav Mehta"></div>
        <div class="form-field"><label>Phone number</label><input placeholder="+91 98765 43210"></div>
      </div>
      <div class="form-field" style="margin-bottom:16px;"><label>Driving licence</label>
        <div class="dropzone">Drag a photo here, or click to upload<br><span style="font-size:11.5px;">JPG/PNG, under 10MB</span></div>
      </div>
      <span class="badge badge-amber">KYC · Pending review</span>
      <div class="flow-actions"><button class="btn btn-outline" onclick="nav('booking',{step:1})">← Back</button><button class="btn btn-primary" onclick="nav('booking',{step:3})">Continue →</button></div>
    </div>`;
  } else if(state.step===3){
    const methods = v.country==="IN"
      ? [["upi","UPI"],["card","Card"],["netbanking","Net Banking"],["cash","Cash at branch"]]
      : [["promptpay","PromptPay"],["card","Card"],["truemoney","TrueMoney"],["cash","Cash at branch"]];
    body = `<div class="flow-card card">
      <h2>Payment</h2><p class="sub">Total due now: <strong class="mono">${v.currency}${fmt(v.price*2+60)}</strong></p>
      <div class="pay-methods">
        ${methods.map(([k,l])=>`<div class="pay-method ${state.pay===k?'sel':''}" onclick="setPay('${k}')">${l}</div>`).join('')}
      </div>
      <div class="form-row"><div class="form-field"><label>Card / UPI ID</label><input placeholder="•••• •••• •••• 4242"></div>
      <div class="form-field"><label>Promo code</label><input placeholder="FIRSTRIDE"></div></div>
      <div class="flow-actions"><button class="btn btn-outline" onclick="nav('booking',{step:2})">← Back</button><button class="btn btn-primary" onclick="nav('booking',{step:4})">Pay &amp; confirm →</button></div>
    </div>`;
  } else {
    body = `<div class="confirm-ticket">
      <div class="confirm-badge">${ICONS.check}</div>
      <h2>Booking confirmed</h2>
      <div class="bid mono">BOOKING ID · RV-${10240+v.id}</div>
      <div class="qr-mock"></div>
      <div class="confirm-grid">
        <div><div class="l">Vehicle</div><div class="v">${v.name}</div></div>
        <div><div class="l">Branch</div><div class="v">${v.city}</div></div>
        <div><div class="l">Pickup</div><div class="v">20 Aug, 10:00 AM</div></div>
        <div><div class="l">Return</div><div class="v">22 Aug, 10:00 AM</div></div>
      </div>
      <button class="btn btn-primary" onclick="nav('home')">Back to home</button>
    </div>`;
  }
  return `<div class="view">${customerNav('detail')}<div class="flow-wrap">${state.step<4?stepper():''}${body}</div></div>`;
}
function setPay(k){ state.pay=k; render(); }

}

/* ============================== ADMIN: DASHBOARD ============================== */
function viewDashboard(){
  const kpis = [
    {l:"Fleet utilization", v:"71%", d:"+4.2% vs last week", up:true},
    {l:"Bookings today", v:"38", d:"+6 vs yesterday", up:true},
    {l:"Revenue today", v:"₹86,400", d:"+12.8%", up:true},
    {l:"Pending KYC", v:"9", d:"-3 since noon", up:false},
  ];
  const pickups = [
    {n:"Aarav Mehta", s:"Honda Activa 6G · Pickup", t:"10:00 AM", c:"#3B4CE0"},
    {n:"Priya Sharma", s:"Royal Enfield · Return", t:"11:30 AM", c:"#2FBF71"},
    {n:"Nattapong S.", s:"Yamaha NMAX · Pickup", t:"1:00 PM", c:"#3B4CE0"},
    {n:"Rohan Gupta", s:"KTM Duke 200 · Return", t:"3:15 PM", c:"#2FBF71"},
    {n:"Kanya T.", s:"Honda PCX160 · Pickup", t:"4:45 PM", c:"#3B4CE0"},
  ];
  const fleetSnap = [["Scooter",68,"var(--route-blue)"],["Motorcycle",22,"var(--route-blue)"],["E-Bike",34,"var(--lime)"],["Maintenance",6,"#F5A623"]];
  const spark = [40,52,48,61,58,70,66,74,69,80,77,88,84,92];
  const max = Math.max(...spark);
  const points = spark.map((v,i)=> `${(i/(spark.length-1))*300},${70-(v/max)*60}`).join(' ');

  return adminShell("Dashboard", `
    <div class="kpi-grid">${kpis.map(k=>`<div class="card kpi-card"><div class="l">${k.l}</div><div class="v mono">${k.v}</div><div class="d ${k.up?'up':'down'}">${k.up?'▲':'▼'} ${k.d}</div></div>`).join('')}</div>
    <div class="a-cols">
      <div class="card panel">
        <div class="panel-head"><h3>Today's pickups &amp; returns</h3><span class="badge badge-slate">14 total</span></div>
        ${pickups.map(p=>`<div class="pickup-row"><span class="dot" style="background:${p.c}"></span><div class="meta"><div class="name">${p.n}</div><div class="sub">${p.s}</div></div><div class="time mono">${p.t}</div></div>`).join('')}
      </div>
      <div class="card panel">
        <div class="panel-head"><h3>Fleet snapshot</h3></div>
        <div class="bar-chart">${fleetSnap.map(([l,v,c])=>`<div class="col"><div class="bar" style="height:${v*1.1}px;background:${c}"></div><div class="lbl">${l}</div></div>`).join('')}</div>
      </div>
    </div>
    <div class="card panel">
      <div class="panel-head"><h3>Revenue trend · last 14 days</h3><span class="badge badge-lime">+18.4%</span></div>
      <svg class="spark" viewBox="0 0 300 70" preserveAspectRatio="none">
        <polyline points="${points}" fill="none" stroke="#3B4CE0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <polygon points="0,70 ${points} 300,70" fill="#3B4CE0" opacity="0.08"/>
      </svg>
    </div>
  `);
}

/* ============================== ADMIN: PRICING ============================== */
function viewPricing(){
  const rows = PRICING_RULES.map(r=>`<tr>
    <td><span class="badge badge-slate">${r.scope}</span></td><td>${r.cat}</td><td>${r.region}</td>
    <td class="mono">${r.rate}</td><td class="mono">${r.deposit}</td><td class="mono">${r.late}</td>

    <div class="table-toolbar"><div></div><button class="btn btn-dark btn-sm">+ New pricing rule</button></div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>Scope</th><th>Category</th><th>Region</th><th>Rate</th><th>Deposit</th><th>Late fee</th></tr></thead><tbody>${rows}</tbody></table></div>
  `);
}

/* ============================== RENDER ============================== */
function render(){
  const map = {
    home: viewHome, browse: viewBrowse, detail: viewDetail, booking: viewBooking,
    dashboard: viewDashboard, fleet: viewFleet, bookings: viewBookings, pricing: viewPricing,
  };
  document.getElementById('app').innerHTML = (map[state.view]||viewHome)();
}
render();

/* ============================== SPLASH CONTROLLER ============================== */
(function(){
  const splash = document.getElementById('splash');
  if(!splash) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ splash.style.display='none'; return; }

  document.body.style.overflow = 'hidden';
  const wordmark = document.getElementById('splashWord');
  const pctEl = document.getElementById('splashPct');
  const RIDE_START = 400, RIDE_DUR = 1900, HOLD = 650, FADE = 700;
  let pct = 0, hidden = false;

  const pctTimer = setInterval(()=>{
    pct = Math.min(100, pct + 100/(RIDE_DUR/50));
    pctEl.textContent = 'PREPARING YOUR ROUTE · ' + String(Math.floor(pct)).padStart(2,'0') + '%';
    if(pct >= 100) clearInterval(pctTimer);
  }, 50);

  const t1 = setTimeout(()=>{
    wordmark.classList.add('show');
    pctEl.textContent = 'READY';
  }, RIDE_START + RIDE_DUR);

  const t2 = setTimeout(hideSplash, RIDE_START + RIDE_DUR + HOLD);

  function hideSplash(){
    if(hidden) return; hidden = true ;
    clearTimeout(t1); clearTimeout(t2); clearInterval(pctTimer);
    splash.classList.add('hide');
    document.body.style.overflow = '';
    setTimeout(()=>{ splash.style.display='none'; }, FADE);
  }
  splash.addEventListener('click', hideSplash);
  document.getElementById('splashSkip').addEventListener('click', hideSplash);
})();
</script>
